name: Documentation Build
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch gh-pages and git config
        run: |
          git fetch origin gh-pages:gh-pages || true
          git branch --set-upstream-to=origin/gh-pages gh-pages || true
          git config user.name docs-bot[bot]
          git config user.email docs-bot@users.noreply.github.com

      - name: Extract version
        id: get_version
        run: |
          VERSION=$(grep -m1 '^version' pyproject.toml | cut -d '"' -f2 | cut -d '.' -f 1,2)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install ${{ vars.PYTHON_VERSION }}

      - name: Set up venv
        run: |
          uv sync --group docs --no-default-groups

      - name: Deploy English docs with mike
        run: |
          uv run mike deploy --config-file mkdocs.en.yml -b gh-pages "${{ env.VERSION }}" latest \
            --update-aliases --alias-type=copy --push

      - name: Build Japanese docs
        run: |
          uv run mkdocs build -f mkdocs.ja.yml -d _site_ja

      - name: Add Japanese docs to gh-pages
        run: |
          git fetch origin gh-pages:gh-pages
          git checkout gh-pages

          mkdir -p "${{ env.VERSION }}/ja"
          cp -r _site_ja/. "${{ env.VERSION }}/ja/"

          mkdir -p latest/ja
          cp -r _site_ja/. latest/ja/

          git add .
          git diff --staged --quiet || git commit -m "ci: add Japanese docs for ${{ env.VERSION }}"
          git push origin gh-pages

          git checkout main
