name: Documentation Build
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git for gh-deploy
        run: |
          git config user.name docs-bot[bot]
          git config user.email docs-bot@users.noreply.github.com

      - uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install ${{ vars.PYTHON_VERSION }}

      - name: Set up venv
        run: uv sync --group docs --no-default-groups

      - name: Check translation sync
        run: uv run python scripts/docs.py check-translations --all

      - name: Build all languages
        run: uv run python scripts/docs.py build-all

      - name: Deploy to gh-pages
        run: uv run ghp-import --no-history --push --force --branch gh-pages site/ps-banshee
