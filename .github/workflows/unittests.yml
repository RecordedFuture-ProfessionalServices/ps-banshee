name: Unittests

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: write
  checks: write
  pull-requests: write


jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        python_version: ${{ fromJSON(vars.PYTHON_SUPPORTED_VERSIONS) }}

    name: "Python ${{ matrix.python_version }}"

    runs-on: ubuntu-latest

    env:
      RF_TOKEN: ${{ secrets.RF_TOKEN || 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' }}
      MIN_COVERAGE: 84
      TERM: dumb
    
    steps:
      - uses: actions/checkout@v7

      - name: Cache tshark debs
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-tshark-${{ runner.os }}-v2

      - name: Install TShark
        run: |
          if command -v tshark >/dev/null; then exit 0; fi
          mkdir -p ~/apt-cache
          if ! ls ~/apt-cache/*.deb >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --download-only -o Dir::Cache::Archives="$HOME/apt-cache" tshark
            sudo rm -rf ~/apt-cache/lock ~/apt-cache/partial
            sudo chown -R "$USER":"$USER" ~/apt-cache
          fi
          sudo dpkg -i ~/apt-cache/*.deb || sudo apt-get install -y -f --no-download

      - uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install ${{ matrix.python_version }}

      - name: Set up venv
        run: uv sync 

      - name: Run Unittests
        run: |
          uv run -p ${{ matrix.python_version}} pytest \
              --cov \
              --cov-fail-under=${{ env.MIN_COVERAGE }} \
              --random-order-bucket=module \
              -v 
