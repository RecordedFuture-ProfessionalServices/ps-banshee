site_name: PS Banshee
site_url: https://recordedfuture-professionalservices.github.io/ps-banshee/latest/ja/
site_description: ターミナルベースの脅威インテリジェンス調査のための Recorded Future CLI。
repo_url: https://github.com/RecordedFuture-ProfessionalServices/ps-banshee
repo_name: ps-banshee
docs_dir: docs/ja

exclude_docs: |
  _includes/

theme:
  logo: assets/favicon.png
  favicon: assets/favicon.png
  name: material
  language: ja
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: ダークモードに切り替え
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切り替え
  features:
    - content.code.annotate
    - content.code.copy
    - content.code.wrap
    - content.footnote.tooltips
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.path
    - navigation.top
    - navigation.tracking
    - navigation.sections
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

extra:
  version:
    provider: mike
  generator: false
  social:
  - icon: fontawesome/brands/youtube
    link: https://www.youtube.com/user/RecordedFuture
  - icon: fontawesome/brands/facebook
    link: https://www.facebook.com/RecordedFuture
  - icon: fontawesome/brands/linkedin
    link: https://www.linkedin.com/company/recorded-future
  - icon: fontawesome/brands/twitter
    link: https://x.com/recordedfuture
  - icon: fontawesome/brands/instagram
    link: https://www.instagram.com/recordedfuture/
  - icon: fontawesome/solid/rss
    link: https://www.recordedfuture.com/feed
  alternate:
    - name: English
      link: /ps-banshee/latest/
      lang: en
    - name: 日本語
      link: /ps-banshee/latest/ja/
      lang: ja

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
      linenums: true
      guess_lang: false
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ['docs/ja']
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

plugins:
  - search

nav:
  - index.md
  - はじめに:
      - getting-started/index.md
      - インストール: getting-started/installation.md
      - 最初のステップ: getting-started/first-steps.md
      - ヘルプの取得: getting-started/help.md
      - AIエージェントとの使用: getting-started/llms.md
  - ユースケース:
      - usecases/index.md
      - アラート管理:
        - usecases/alerts/index.md
      - 検出ルール:
        - usecases/detection-rules/index.md
      - メール解析:
        - usecases/email/index.md
      - エンティティ照合:
        - usecases/entity/index.md
      - IOCエンリッチメント:
        - usecases/enrichment/index.md
      - パケットキャプチャ解析:
        - usecases/pcap/index.md
      - リスクリスト:
        - usecases/risklists/index.md
      - ウォッチリスト管理:
        - usecases/watchlist/index.md
  - リファレンス:
      - reference/index.md
      - コマンド: reference/commands.md
      - 環境変数: reference/environment.md
  - リリース履歴: CHANGELOG.md
  - about.md
