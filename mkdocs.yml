site_name: PS Banshee
site_url: https://recordedfuture-professionalservices.github.io/ps-banshee/
site_description: A Recorded Future CLI for terminal-based threat intelligence investigations.
repo_url: https://github.com/RecordedFuture-ProfessionalServices/ps-banshee
repo_name: ps-banshee
docs_dir: docs

exclude_docs: |
  _includes/

theme:
  logo: assets/favicon.png
  favicon: assets/favicon.png
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.annotate
    - content.code.copy
    - content.code.wrap
    - content.footnote.tooltips
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.path
    - navigation.top
    - navigation.tracking
    - navigation.sections
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

extra:
  version:
    provider: mike
  generator: false
  social:
  - icon: fontawesome/brands/youtube
    link: https://www.youtube.com/user/RecordedFuture
  - icon: fontawesome/brands/facebook
    link: https://www.facebook.com/RecordedFuture
  - icon: fontawesome/brands/linkedin
    link: https://www.linkedin.com/company/recorded-future
  - icon: fontawesome/brands/twitter
    link: https://x.com/recordedfuture
  - icon: fontawesome/brands/instagram
    link: https://www.instagram.com/recordedfuture/
  - icon: fontawesome/solid/rss
    link: https://www.recordedfuture.com/feed

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
      linenums: true
      guess_lang: false
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

plugins:
  - search
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
          site_name: PS Banshee
        - locale: ja
          name: 日本語
          build: true
          site_name: PS Banshee
          site_description: ターミナルベースの脅威インテリジェンス調査のための Recorded Future CLI。
          theme:
            language: ja
            font:
              text: Noto Sans JP
              code: Roboto Mono
            palette:
              - scheme: default
                primary: indigo
                accent: indigo
                toggle:
                  icon: material/weather-night
                  name: ダークモードに切り替え
              - scheme: slate
                primary: indigo
                accent: indigo
                toggle:
                  icon: material/weather-sunny
                  name: ライトモードに切り替え
          nav_translations:
            Getting Started: はじめに
            Installation: インストール
            First Steps: 最初のステップ
            Getting help: ヘルプの取得
            Using with AI agents: AIエージェントとの使用
            Use cases: ユースケース
            Alert Management: アラート管理
            Detection Rules: 検出ルール
            Email Enrichment: メール解析
            Entity Matching: エンティティ照合
            IOC Enrichment: IOCエンリッチメント
            Packet Capture Enrichment: パケットキャプチャ解析
            Risk Lists: リスクリスト
            Watchlist Management: ウォッチリスト管理
            Reference: リファレンス
            Commands: コマンド
            Environment variables: 環境変数
            Release History: リリース履歴
  - llmstxt-md:
      enable_copy_button: false
      markdown_description: |
        Full single-file bundle (every command group inlined): <https://recordedfuture-professionalservices.github.io/ps-banshee/latest/llms-full.txt>

        Set `RF_TOKEN` in the shell environment before invoking any command.

        **Alerts:** Recorded Future has two distinct alert systems. Use `ca` for Classic Alerts - legacy rule-based alerts with short opaque IDs (6+ chars, e.g. `tybakN`). Use `pba` for Playbook Alerts - automation-driven alerts with 36-char UUID IDs (the `task:` prefix is optional; `pba search` returns them with the prefix). Categories exclusive to PBA: `domain_abuse`, `cyber_vulnerability`, `third_party_risk`, `code_repo_leakage`, `identity_novel_exposures`, `geopolitics_facility`, `malware_report`. If the user gives you an alert ID, pick the group by ID length; if they describe the category, the categories above route to `pba`.
      sections:
        Commands:
          - knowledge-base/index.md: "Authentication, readiness checks, output conventions, and shared LLM notes for the CLI."
          - knowledge-base/ca.md: "Classic Alerts (legacy rule-based, short opaque IDs of 6+ chars like `tybakN`). Search, lookup, update, export."
          - knowledge-base/email.md: "Enrich EML files with RF intelligence."
          - knowledge-base/entity.md: "Entity search and lookup."
          - knowledge-base/ioc.md: "IOC enrichment, bulk enrichment, search, rules."
          - knowledge-base/list.md: "Manage RF Lists & Watch Lists (create, add/remove entities, entries)."
          - knowledge-base/pba.md: "Playbook Alerts (36-char UUID IDs, `task:` prefix optional; PBA-exclusive categories: domain_abuse, cyber_vulnerability, third_party_risk, code_repo_leakage, identity_novel_exposures, geopolitics_facility, malware_report). Search, lookup, update, export."
          - knowledge-base/pcap.md: "Enrich packet captures with RF intelligence."
          - knowledge-base/risklist.md: "Fetch, create, and inspect risk lists."
          - knowledge-base/rules.md: "Search and download detection rules (Sigma, YARA, Snort)."
        Optional:
          - getting-started/installation.md: "Install the ps-banshee CLI and set RF_TOKEN authentication."
          - getting-started/llms.md: "Wire banshee into an AI agent (CLAUDE.md / AGENTS.md) and authenticate."
          - usecases/index.md: "Worked, end-to-end use-case walkthroughs (alerts, enrichment, risk lists, etc.)."

nav:
  - index.md
  - Getting Started:
      - getting-started/index.md
      - Installation: getting-started/installation.md
      - First Steps: getting-started/first-steps.md
      - Getting help: getting-started/help.md
      - Using with AI agents: getting-started/llms.md
  - Use cases:
      - usecases/index.md
      - Alert Management:
        - usecases/alerts/index.md
      - Detection Rules:
        - usecases/detection-rules/index.md
      - Email Enrichment:
        - usecases/email/index.md
      - Entity Matching:
        - usecases/entity/index.md
      - IOC Enrichment:
        - usecases/enrichment/index.md
      - Packet Capture Enrichment:
        - usecases/pcap/index.md
      - Risk Lists:
        - usecases/risklists/index.md
      - Watchlist Management:
        - usecases/watchlist/index.md
  - Reference:
      - reference/index.md
      - Commands: reference/commands.md
      - Environment variables: reference/environment.md
  - Release History: CHANGELOG.md
  - about.md
