[project]
name = "ps-banshee"
version = "1.3.1"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10, <3.14"
description = "PS Banshee is a command line tool used to access Recorded Future Intelligence. PS Banshee is designed to get you working quickly with Recorded Future."
authors = [
    { name = "Ernest Bartosevic", email = "ernest.bartosevic@recordedfuture.com" }
]
maintainers = [
    { name = "Moise Medici", email = "moise.medici@recordedfuture.com" },
    { name = "Ernest Bartosevic", email = "ernest.bartosevic@recordedfuture.com" },
]
keywords = ['API', 'Recorded Future', 'Cyber Security Engineering', 'Threat Intelligence', 'command line tool', 'CLI', 'ioc enrichment']
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Intended Audience :: Information Technology",
    "Development Status :: 5 - Production/Stable",
    "Topic :: Security"
]

dependencies = [
    "typer<0.16.0",
    "pyshark==0.6",
    "polars~=1.34.0",
    "psengine~=2.8.3"
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff~=0.15.8",
    "pytest==9.0.3",
    "pytest-vcr==1.0.2",
    "vcrpy==8.2.1",
    "pytest-cov==6.0.0",
    "pytest-mock==3.14.0",
    "pytest-random-order==1.2.0",
    "pytest-md==0.2.0",
    "mimesis>=12.1.0"
]

docs = [
    "mike~=2.1.3",
    "mkdocs~=1.6.1",
    "mkdocs-material~=9.7.6",
    "mkdocstrings[python]>=1.0.4",
    "griffe-typingdoc~=0.2.8",
    "mkdocs-llmstxt-md~=0.2.0",
    "pymdown-extensions~=10.21.3",
]

[project.scripts]
banshee = "banshee.main:app"

[project.urls]
Homepage = "https://recordedfuture-professionalservices.github.io/ps-banshee/latest/"
Changelog = "https://recordedfuture-professionalservices.github.io/ps-banshee/latest/CHANGELOG/"
Source = "https://github.com/recordedfuture-professionalservices/ps-banshee"

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-root = ""
module-name = "banshee"
source-exclude = [
    # Hidden directories
    ".git/**",
    ".github/**",
    ".pytest_cache/**",
    ".ruff_cache/**",
    ".venv/**",

    # Hidden files
    ".coverage",
    ".env",
    ".gitignore",
    ".python-version",

    # Build and test artifacts
    "dist/**",
    "build/**",
    "*.egg-info/**",

    # Generated documentation
    "docs/**",

    # Tests
    "htmlcov/**",
    "test_files/**",
    "tests/**",

    # Release artifacts
    "CHANGELOG.md",

    # Lock and cache files
    "__pycache__/**",
    "uv.lock",
    "*.pyc",
    "*.pyo",
    "*.log",
    "*.log.*",
]

